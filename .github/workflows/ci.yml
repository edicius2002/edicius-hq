name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Read from .nvmrc rather than repeated here. Two places to write the
          # same version is one place for them to disagree, silently, until a
          # local build passes something CI does not.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck SEACE preview API
        run: npx tsc --noEmit --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 --types node api/seace/preview.ts api/seace/preview-file.ts api/seace/preview-worker.ts api/seace/previewAdapters.ts api/seace/previewCore.ts

      - name: Test
        run: npm run test

      - name: Test SEACE preview API
        run: node --test api/seace/previewCore.test.mjs

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Format check
        run: python -m ruff format --check . ../../scripts

      - name: Lint
        run: python -m ruff check . ../../scripts

      - name: Typecheck
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Test Pi operator tooling
        run: python -m pytest ../../ops/pi/tests

      - name: Test SEACE preview worker
        run: python -m pytest ../../services/seace/tests/test_preview_worker.py

  image:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The API ships as a container — docker-compose.yml builds this exact
      # Dockerfile — and until now nothing built it outside a developer's
      # machine. A base image that stops resolving, a dependency that no longer
      # installs, or the playwright chromium step failing would all have shown
      # up as a broken `docker compose up` rather than as a red check.
      # Decision 10.7: anything not in CI rots.
      #
      # Build only. Publishing waits for step 7 to pick a deploy target; this
      # job answers the narrower question of whether the image still assembles.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: services/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
