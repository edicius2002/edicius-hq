services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - '${API_PORT:-8000}:8000'
    environment:
      LOCAL_DATA_DIR: /app/.local-data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      API_AUTH_BACKEND: ${API_AUTH_BACKEND:?Set API_AUTH_BACKEND explicitly}
      COLLECTOR_DATA_BACKEND: ${COLLECTOR_DATA_BACKEND:?Set COLLECTOR_DATA_BACKEND explicitly}
      AIRFARE_SYNC_BACKEND: ${AIRFARE_SYNC_BACKEND:?Set AIRFARE_SYNC_BACKEND explicitly}
      AIRFARE_DATA_BACKEND: ${AIRFARE_DATA_BACKEND:-local}
      AIRFARE_SYNC_ENABLED: ${AIRFARE_SYNC_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      COLLECTOR_SUPABASE_TIMEOUT_SECONDS: ${COLLECTOR_SUPABASE_TIMEOUT_SECONDS:-15}
      EDICIUS_OWNER_ID: ${EDICIUS_OWNER_ID:?Set EDICIUS_OWNER_ID}
      # Opt-in only; supplements Google H2 nulls with the SKY booking API.
      SKY_OFFICIAL_LOOKUP_ENABLED: ${SKY_OFFICIAL_LOOKUP_ENABLED:-false}
    volumes:
      - ./services/api/app:/app/app
      - ./services/api/tests:/app/tests
      - ./services/api/pytest.ini:/app/pytest.ini
      - ./services/api/.local-data:/app/.local-data
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-5173}:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_DATA_BACKEND: ${VITE_DATA_BACKEND:?Set VITE_DATA_BACKEND explicitly}
      VITE_NEON_DATA_API_URL: ${VITE_NEON_DATA_API_URL:-}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  web_node_modules:
  web_app_node_modules:
