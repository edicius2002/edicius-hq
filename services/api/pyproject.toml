[tool.ruff]
# The web side is checked for format, lint and types on every push; the API was
# only ever run through pytest. The gap showed: the code already carried
# `# noqa: BLE001` suppressions for a linter that was never installed, so they
# suppressed nothing and nobody could tell.
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes — unused imports and names, the ones that rot quietly
    "I",    # import order, so a diff never argues about it
    "UP",   # pyupgrade — this targets 3.12 and should read like it
    "B",    # bugbear — the mutable-default and loop-variable-capture family
    "BLE",  # blind except, which the stream adapters take on purpose and say so
    "SIM",  # simplifications
    "RUF",  # ruff's own
]

ignore = [
    # Long lines are a formatter's business, and the formatter already ran.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests build fixtures and assert on them; a magic number in an assertion is
# the assertion. Reaching into a private helper is also fair there.
"tests/*" = ["S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Non-strict on purpose. The seven `# type: ignore[...]` comments already in
# this code were written for a checker nobody had installed — decision 10.1's
# finding, one layer up — so they are the ready-made baseline, and the point of
# turning it on is to stop that happening again rather than to reach strictness
# in one move.
python_version = "3.12"
# Pinned for the same reason `python_version` is: without it mypy assumes
# whatever platform it is running on, so this gate returned different answers
# on the maintainer's Windows machine and in CI. `_loop_factory` in
# `tweet_watcher` is the code that exposes it — Playwright's driver needs a
# `ProactorEventLoop` on Windows and there is no such name anywhere else, so
# under win32 the `# type: ignore[attr-defined]` it carries reads as unused and
# the line after it reads as unreachable, which is precisely the reverse of
# what CI saw. Two errors locally, zero on CI, on identical source.
# Linux is what CI runs and what the API is deployed onto, so it is what the
# gate should be answering about. The cost is that mypy no longer checks the
# win32 branch of a platform switch; mypy can only be pointed at one platform
# at a time, and an unchecked branch is better than a gate whose result depends
# on who ran it.
platform = "linux"
# `app` and the repo-root scripts, which is the same widening ruff already got
# and for a fault that had already happened rather than a hypothetical one:
# `scripts/fares-collect.py` passed `focus=` to a `FareWatch` that lost the
# field two decisions ago, so it raised `TypeError` on its first watch and every
# gate passed anyway. Ruff cannot see that — an argument name is a type
# question — and mypy was pointed at `app` alone, so the one file a scheduler
# would actually invoke was the one file nothing typechecked. Four files, four
# seconds.
files = ["app", "../../scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# The suppressions have to name their rule, so the next one cannot be a blanket.
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
# Fixtures assert on shapes they built; annotating them buys nothing.
module = "tests.*"
ignore_errors = true
